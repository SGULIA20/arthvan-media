name: refresh-token

on:
  schedule:
    - cron: '30 12 * * 0'   # Sundays 12:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh the Instagram token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_TOKEN_DATE: ${{ vars.LINKEDIN_TOKEN_DATE }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u -m engine.refresh
