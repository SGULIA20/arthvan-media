name: linkedin-evening

# The morning of a LinkedIn post (Mon, Wed, Fri): write today's post and send the founder its text and the picture prompt before
# 08:00 Lagos (founder, 25 Nov 2026: "why draft needs to write 12-15 hours before ... draft and everything may come to me by 8 am").
# Until then this ran the evening before, hence the file's name. The engine writes once per post and does nothing on other days or
# after 08:00, so several slots are safe: GitHub's own schedule is often late, which is why the first slot is 05:07 Lagos.
on:
  schedule:
    - cron: '7 4 * * 1,3,5'
    - cron: '37 4 * * 1,3,5'
    - cron: '7 5 * * 1,3,5'
    - cron: '37 5 * * 1,3,5'
    - cron: '7 6 * * 1,3,5'
    - cron: '37 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      trial:
        description: 'trend, markets or news = write a SAMPLE of that live post and send it to Telegram (nothing saved or posted); blank = the normal evening run'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: linkedin-personal
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "arthvan-autoposter"
          git config user.email "autoposter@users.noreply.github.com"
      - name: Plan tomorrow's post and ask for its picture
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAUSE: ${{ vars.PAUSE }}
          TRIAL: ${{ github.event.inputs.trial }}
        run: |
          if [ -n "$TRIAL" ]; then python -m engine.linkedin_personal trial --category "$TRIAL"; else python -m engine.linkedin_personal evening; fi
