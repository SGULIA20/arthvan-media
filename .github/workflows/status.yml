name: status

# Evening Telegram: the founder's scorecard (relayed from the content pipeline, same text on both bots) and the credit/buffer line.
on:
  schedule:
    - cron: '28 20 * * *'   # 21:28 Lagos: relays the 9 pm card the content pipeline writes at 21:03 (founder, 22 Oct 2026)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send the credit and buffer line
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.notify --credit
      - name: Relay the evening scorecard (same card as the content bot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.relay_scorecard
