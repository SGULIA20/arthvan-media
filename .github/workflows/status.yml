name: status

# Evening Telegram: the credit/buffer line. The 9 pm scorecard comes from the content bot only (founder, 24 Nov 2026: 'Scorecard on one
# bot'); until then this bot relayed the same card (21 Oct 2026). engine/relay_scorecard.py is kept, unused, in case he wants it back.
on:
  schedule:
    - cron: '28 20 * * *'   # 21:28 Lagos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send the credit and buffer line
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.notify --credit
