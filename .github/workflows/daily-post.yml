name: daily-post

on:
  schedule:
    - cron: '37 14 * * *'  # about 15:37 Lagos = 20:07 India (the audience is 87% India; was 18:00 Lagos = 22:30 India); off-peak minute, GitHub delays :00 jobs
    - cron: '37 15 * * *'  # safety net one hour later; the engine never posts twice on one day
    - cron: '37 16 * * *'  # two more chances (GitHub has skipped slots for hours); replaces the Mac's backup trigger, 21 Oct 2026
    - cron: '37 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'render = draw only, prepare = everything except publishing, post = publish'
        type: choice
        options: [render, prepare, post]
        default: render
      date:
        description: 'Lagos date YYYY-MM-DD (optional)'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75          # 22 Oct 2026: a full set (Instagram waits, YouTube, Threads, LinkedIn, catch-up post) outran 30 min and was cancelled mid-way
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m pytest -q -m "not slow"
      - name: Git identity
        run: |
          git config user.name "arthvan-autoposter"
          git config user.email "autoposter@users.noreply.github.com"
      - name: Run the daily set
        id: run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SGLEARNING_REFRESH_TOKEN: ${{ secrets.YT_SGLEARNING_REFRESH_TOKEN }}
          YT_ARTHVAN_REFRESH_TOKEN: ${{ secrets.YT_ARTHVAN_REFRESH_TOKEN }}
          GUPSHUP_APP_ID: ${{ secrets.GUPSHUP_APP_ID }}
          GUPSHUP_API_KEY: ${{ secrets.GUPSHUP_API_KEY }}
          GUPSHUP_APP_NAME: ${{ vars.GUPSHUP_APP_NAME }}
          GUPSHUP_SOURCE: ${{ vars.GUPSHUP_SOURCE }}
          WA_STATUS_TO: ${{ secrets.WA_STATUS_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          WA_STATUS_TEMPLATE: ${{ vars.WA_STATUS_TEMPLATE }}
          PAUSE: ${{ vars.PAUSE }}
          MODE: ${{ github.event.inputs.mode || 'post' }}
          RUN_DATE: ${{ github.event.inputs.date }}
        run: python -m engine.run_daily --mode "$MODE" ${RUN_DATE:+--date "$RUN_DATE"}
      - name: Catch up the founder's LinkedIn post if the morning slots were skipped (the engine never posts twice a day)
        if: always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'post')
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAUSE: ${{ vars.PAUSE }}
        run: python -m engine.linkedin_personal post || true
      - name: Tell the founder if the workflow broke before the engine could report
        if: failure() && steps.run.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m engine.notify --text "⚠️ The daily post workflow stopped before it could post (tests or setup failed). Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
