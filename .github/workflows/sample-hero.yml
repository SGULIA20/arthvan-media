name: sample-hero

# Makes sample photoreal "hero" pictures for the first shot of a Reel (founder, 9 Nov 2026: test a realistic opening picture).
# Two pictures at about Rs 3 each; saved to samples/hero/ on main. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draw the samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p samples/hero
          python - <<'PY'
          from pathlib import Path
          from engine import illustrate
          P = {
           "kumbhalgarh": "Photorealistic cinematic aerial drone photograph, vertical 9:16 composition, of the ancient Kumbhalgarh fort wall in Rajasthan winding endlessly along green Aravalli hill ridges at golden dawn, thin mist in the valleys, sharp stone ramparts, deep depth of field, ultra detailed, natural colours, no text, no people, no watermark.",
           "dwarka": "Photorealistic cinematic underwater photograph, vertical 9:16 composition, of ancient carved stone ruins and walls on the sea floor off Gujarat, shafts of sunlight from the surface, drifting particles, fish, teal and gold colours, ultra detailed, dramatic wide angle, no text, no people, no watermark.",
          }
          for name, prompt in P.items():
              illustrate.generate(prompt, Path("samples/hero") / f"{name}.png")
              print("made", name)
          PY
      - name: Save
        run: |
          git config user.name "arthvan-autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -f samples/hero/*.png
          git commit -qm "sample hero pictures [skip ci]"
          git pull --rebase --autostash origin main && git push origin HEAD:main
