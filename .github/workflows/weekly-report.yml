name: weekly-report

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays 07:23 Lagos
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the performance report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m engine.digest > report.md
      - name: Competitor ad radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m radar.collect
          python -m radar.report > radar.md
          python -m radar.comments >> radar.md
          printf '\n\n---\n\n' >> report.md
          cat radar.md >> report.md
      - name: Save it in the repo
        run: |
          git config user.name "arthvan-autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add docs/reports radar/snapshots radar/reports
          git diff --cached --quiet || git commit -m "weekly report $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Open it as an issue so GitHub emails the owner
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "Weekly Instagram report $(date -u +%F)" --body-file report.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Send the week's summary to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: python -m engine.notify --weekly report.md --link "$ISSUE_URL"
