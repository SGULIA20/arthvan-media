<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(../../engine/fonts/Inter-800.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../engine/fonts/Inter-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--fg);background:var(--bg);position:relative}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.o1{position:absolute;right:-250px;top:-300px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.28}
.o2{position:absolute;left:-300px;bottom:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,var(--good),transparent);opacity:.2}
.head{position:absolute;left:80px;right:80px;top:110px;text-align:center}
.h1{font-weight:800;font-size:84px;line-height:1.06;letter-spacing:-.03em}
.h1 em{font-style:normal;color:var(--accent)}
.sub{font-weight:600;font-size:40px;color:var(--muted);margin-top:26px;line-height:1.3}
.phone{position:absolute;left:50%;transform:translateX(-50%);bottom:-120px;width:760px;height:1560px;border-radius:92px;background:#0b0b0f;padding:18px;box-shadow:0 60px 120px rgba(0,0,0,.55),inset 0 0 0 3px #2a2a33}
.screen{width:100%;height:100%;border-radius:74px;overflow:hidden;background:#000;position:relative}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:160px;height:36px;border-radius:20px;background:#0b0b0f}
.badge{position:absolute;left:80px;top:1700px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:36px}
.badge img{width:72px;height:72px;border-radius:18px}
.n{position:absolute;right:80px;top:1716px;font-weight:600;font-size:30px;color:var(--muted)}
</style></head><body>
<div class="bg"></div><div class="o1"></div><div class="o2"></div>
<div class="head"><div class="h1" id="h1"></div><div class="sub" id="sub"></div></div>
<div class="phone"><div class="screen"><img id="shot"></div></div>
<script>
const Q=new URLSearchParams(location.search), P=JSON.parse(decodeURIComponent(Q.get('p')));
for(const k in P.palette) document.body.style.setProperty('--'+k,P.palette[k]);
document.getElementById('h1').innerHTML=P.h1; document.getElementById('sub').textContent=P.sub||'';
document.getElementById('shot').src=P.shot;
</script></body></html>
