<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(../fonts/Inter-800.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/Inter-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.abs{position:absolute}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.o1{position:absolute;right:-250px;top:-300px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(closest-side,var(--accent),transparent);opacity:.26}
.o2{position:absolute;left:-300px;bottom:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,var(--good),transparent);opacity:.18}
.sub{position:absolute;left:60px;right:60px;bottom:90px;text-align:center;font-weight:600;font-size:46px;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sub span{background:rgba(0,0,0,.45);padding:6px 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.title{position:absolute;left:70px;right:70px;top:150px;font-weight:800;font-size:96px;line-height:1.05;letter-spacing:-.02em;text-align:center}
.screen{position:absolute;width:560px;height:1100px;border-radius:66px;background:#0b0b0f;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:56px;display:block}
.brand{position:absolute;left:70px;top:70px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px}
.brand img{width:76px;height:76px;border-radius:20px}
.char{position:absolute;bottom:230px;transform-origin:50% 100%}
.char img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.head{position:absolute;transform-origin:50% 100%}
.head img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
</style></head><body><div id="root"></div>
<script>
const D=window.STORY, C=D.chars; const root=document.getElementById('root');
for(const k in D.palette) document.documentElement.style.setProperty('--'+k,D.palette[k]);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const eo=x=>1-Math.pow(1-clamp(x),3);
const S=D.scenes; let T=0; S.forEach(s=>{s.start=T; T+=s.dur;}); window.TOTAL=T;
// mouth: open while the voice is loud (D.vo_env = per-frame loudness 0..1 for the whole timeline at 30 fps)
function mouthOpen(t){ const i=Math.floor(t*30); const e=(D.vo_env[i]||0); return e>0.25 ? (Math.floor(t*12)%2 ? 'head_talk_b':'head_talk_a') : null; }
function charImg(pose){ return D.char_base+'/'+C+'_'+pose+'.png'; }
function fullBody(pose,x,w,t,bob){ const dy=Math.sin(t*2.1)*bob; return `<div class="char" style="left:${x}px;width:${w}px;height:${w*1.0}px;transform:translateY(${dy}px)"><img src="${charImg(pose)}"></div>`; }
function headShot(base,x,y,w,t){ const m=mouthOpen(t); const pose=m||base; const dy=Math.sin(t*1.7)*6, rot=Math.sin(t*0.9)*1.2; return `<div class="head" style="left:${x}px;top:${y}px;width:${w}px;height:${w}px;transform:translateY(${dy}px) rotate(${rot}deg)"><img src="${charImg(pose)}"></div>`; }
function screen(s,local,x,y){ if(!s.screen) return ''; const p=eo((local-0.9)/0.6); return `<div class="screen" style="left:${x}px;top:${y+(1-p)*60}px;opacity:${p}"><img src="${D.shots}/${s.screen}"></div>`; }
function endHTML(t){ const p=i=>eo((t-.4-i*.25)/.5); return `<div class="abs" style="left:300px;right:40px;top:900px;text-align:center"><img src="${D.icon}" style="width:170px;height:170px;border-radius:42px;opacity:${p(0)}"><div style="font-weight:800;font-size:104px;letter-spacing:-.03em;opacity:${p(1)}">${D.app_name}</div><div style="font-weight:600;font-size:50px;color:var(--muted);margin-top:8px;opacity:${p(2)}">${D.end_line}</div><img src="${D.badge}" style="width:460px;margin-top:36px;opacity:${p(3)}"><div style="font-weight:800;font-size:52px;color:var(--accent);margin-top:26px;opacity:${p(4)}">Link in bio</div><div style="font-size:26px;color:var(--muted);margin-top:46px;opacity:${p(4)}">${D.disclaimer}</div></div>`; }
window.render=function(t){
  let s=S[S.length-1]; for(const x of S){ if(t>=x.start && t<x.start+x.dur){ s=x; break; } }
  const local=t-s.start, fade=Math.min(eo(local/.4), eo((s.start+s.dur-t)/.4));
  let h=`<div class="bg"></div><div class="o1"></div><div class="o2"></div><div class="abs" style="inset:0;opacity:${fade}">`;
  if(s.layout==='talk'){            // big head, speaking to camera
    h+=headShot(s.pose||'head_neutral',90,330,900,local);
  } else if(s.layout==='present'){  // full body left, phone screen right
    h+=screen(s,local,480,250)+fullBody(s.pose||'explaining_right',-330,1050,local,5);
  } else if(s.layout==='scene'){    // full body centre, prop text above
    h+=`<div class="abs" style="left:70px;right:70px;top:300px;text-align:center;font-weight:800;font-size:72px;line-height:1.1;opacity:${eo((local-.3)/.5)}">${s.card||''}</div>`+fullBody(s.pose||'front_neutral',-110,1300,local,6);
  } else if(s.layout==='end'){
    h+=endHTML(local)+`<div style="position:absolute;left:-420px;bottom:-150px;width:1000px;height:1000px"><img src="${charImg(s.pose||'front_happy')}" style="width:100%;height:100%;object-fit:contain;object-position:bottom"></div>`;
  }
  h+='</div>';
  if(s.layout!=='end') h+=`<div class="brand"><img src="${D.icon}"><span>${D.app_name}</span></div>`;
  if(s.title && local<2.4) h+=`<div class="title" style="opacity:${eo(local/.5)*eo((2.4-local)/.4)}">${s.title}</div>`;
  if(s.sub && s.layout!=='end') h+=`<div class="sub" style="opacity:${fade}"><span>${s.sub}</span></div>`;
  root.innerHTML=h;
};
render(0);
</script></body></html>
