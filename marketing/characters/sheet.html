<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(../../engine/fonts/Inter-800.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../engine/fonts/Inter-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box} body{width:1600px;background:var(--bg);font-family:Inter,sans-serif;color:#fff;padding:40px}
h1{font-weight:800;font-size:44px;margin-bottom:6px} .lede{color:var(--muted);font-weight:600;font-size:22px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:rgba(255,255,255,.06);border-radius:28px;padding:22px;text-align:center}
.card svg{width:100%;height:330px} .tag{font-weight:800;font-size:30px;margin-top:8px;color:var(--accent)} .desc{font-weight:600;font-size:19px;color:var(--muted);margin-top:8px;line-height:1.35;min-height:100px}
</style></head><body><div id="app"></div>
<script>
const Q=new URLSearchParams(location.search), which=Q.get('c');
const SETS={
 lumi:{bg:'#06184A',muted:'#9FB0D6',accent:'#F2B454',title:'Lumi — ScoreMyBiz',lede:'Four candidates, same flat style. Each can show calm, worried and bright moods.',cards:[
  {tag:'A · Lamp (current, refined)',desc:'A glowing lamp with short arms and a tiny notebook. Idea: "sheds light on your money". Soft, friendly, always warm.',svg:`<g transform="translate(200,170)"><circle r="130" fill="#F2B454" opacity=".18"/><path d="M-62,-60 C-62,-135 62,-135 62,-60 C62,-18 36,2 34,34 L-34,34 C-36,2 -62,-18 -62,-60 Z" fill="#FFE39A" stroke="#F2B454" stroke-width="7"/><rect x="-34" y="34" width="68" height="20" rx="6" fill="#22346F"/><rect x="-27" y="54" width="54" height="14" rx="5" fill="#152559"/><circle cx="-20" cy="-55" r="8" fill="#06184A"/><circle cx="20" cy="-55" r="8" fill="#06184A"/><path d="M-16,-32 Q0,-18 16,-32" fill="none" stroke="#06184A" stroke-width="6" stroke-linecap="round"/><path d="M-62,-20 Q-100,0 -92,40" fill="none" stroke="#FFE39A" stroke-width="12" stroke-linecap="round"/><path d="M62,-20 Q100,0 96,36" fill="none" stroke="#FFE39A" stroke-width="12" stroke-linecap="round"/><rect x="84" y="24" width="42" height="54" rx="6" fill="#FBF6E6" stroke="#B89A6A" stroke-width="4" transform="rotate(12 105 51)"/></g>`},
  {tag:'B · Coin',desc:'A gold rupee coin with a face and a confident stance. Idea: money that talks back. Bolder, more "business", good for stats.',svg:`<g transform="translate(200,170)"><circle r="110" fill="#F2B454" stroke="#C98B2A" stroke-width="10"/><circle r="86" fill="none" stroke="#C98B2A" stroke-width="4" opacity=".6"/><text x="-34" y="-8" font-size="90" font-weight="800" font-family="Inter" fill="#8A5A12">₹</text><circle cx="-26" cy="-40" r="9" fill="#06184A"/><circle cx="26" cy="-40" r="9" fill="#06184A"/><path d="M-22,40 Q0,62 22,40" fill="none" stroke="#06184A" stroke-width="7" stroke-linecap="round"/><path d="M-110,10 L-150,40" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/><path d="M110,10 L150,-30" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/><path d="M-40,110 L-50,160 M40,110 L50,160" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/></g>`},
  {tag:'C · Khata (notebook)',desc:'A shop ledger with glasses and a pencil behind its ear. Idea: the book that finally explains itself. Wise, a little funny, very Indian-shop.',svg:`<g transform="translate(200,170)"><rect x="-100" y="-140" width="200" height="280" rx="16" fill="#D9634A"/><rect x="-82" y="-140" width="14" height="280" fill="#B64A33"/><rect x="-60" y="-110" width="140" height="220" rx="10" fill="#FBF6E6"/><circle cx="-10" cy="-50" r="22" fill="none" stroke="#22346F" stroke-width="6"/><circle cx="46" cy="-50" r="22" fill="none" stroke="#22346F" stroke-width="6"/><line x1="12" y1="-50" x2="24" y2="-50" stroke="#22346F" stroke-width="6"/><circle cx="-10" cy="-50" r="7" fill="#22346F"/><circle cx="46" cy="-50" r="7" fill="#22346F"/><path d="M-6,30 Q18,54 42,30" fill="none" stroke="#22346F" stroke-width="6" stroke-linecap="round"/><rect x="60" y="-150" width="16" height="90" rx="4" fill="#F2B454" transform="rotate(20 68 -105)"/><path d="M-100,0 L-140,30 M100,0 L140,-20" stroke="#D9634A" stroke-width="14" stroke-linecap="round"/></g>`},
  {tag:'D · Little helper (robot)',desc:'A small round assistant with a screen face that shows the score. Idea: the advisor in your pocket. Modern, works for the AI Advisor stories.',svg:`<g transform="translate(200,170)"><rect x="-110" y="-110" width="220" height="200" rx="60" fill="#2951FF"/><rect x="-84" y="-80" width="168" height="110" rx="26" fill="#06184A"/><circle cx="-34" cy="-30" r="12" fill="#5EEAD4"/><circle cx="34" cy="-30" r="12" fill="#5EEAD4"/><path d="M-26,4 Q0,24 26,4" fill="none" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round"/><text x="-26" y="60" font-size="40" font-weight="800" font-family="Inter" fill="#F2B454">66</text><circle cx="0" cy="-130" r="12" fill="#F2B454"/><line x1="0" y1="-118" x2="0" y2="-110" stroke="#F2B454" stroke-width="6"/><path d="M-110,10 L-150,50 M110,10 L150,50" stroke="#2951FF" stroke-width="16" stroke-linecap="round"/><path d="M-50,90 L-50,140 M50,90 L50,140" stroke="#2951FF" stroke-width="16" stroke-linecap="round"/></g>`}]},
 mira:{bg:'#150F1E',muted:'#B7AECB',accent:'#FF8066',title:'Mira — Waypoint',lede:'Four candidates for a character that listens. No human face, so nothing about who you are.',cards:[
  {tag:'A · Lantern',desc:'A soft paper lantern that glows brighter when someone answers. Matches names like MoonlitLantern. Quiet, patient.',svg:`<g transform="translate(200,170)"><circle r="140" fill="#FF8066" opacity=".16"/><line x1="0" y1="-160" x2="0" y2="-120" stroke="#B7AECB" stroke-width="6"/><rect x="-60" y="-120" width="120" height="22" rx="8" fill="#3A2A4E"/><path d="M-80,-100 C-110,-20 -110,40 -80,110 L80,110 C110,40 110,-20 80,-100 Z" fill="#FFB38A" stroke="#FF8066" stroke-width="6"/><path d="M-80,-40 L80,-40 M-92,20 L92,20 M-80,80 L80,80" stroke="#FF8066" stroke-width="4" opacity=".6"/><rect x="-50" y="110" width="100" height="18" rx="6" fill="#3A2A4E"/><circle cx="-22" cy="0" r="7" fill="#150F1E"/><circle cx="22" cy="0" r="7" fill="#150F1E"/><path d="M-12,24 Q0,32 12,24" fill="none" stroke="#150F1E" stroke-width="5" stroke-linecap="round"/></g>`},
  {tag:'B · Moth',desc:'A night moth drawn to small lights. Idea: it finds you when you are up late. Gentle, a little melancholy, very Waypoint.',svg:`<g transform="translate(200,170)"><path d="M0,0 C-40,-120 -170,-120 -150,-20 C-170,60 -60,90 0,40 Z" fill="#5EEAD4" opacity=".85"/><path d="M0,0 C40,-120 170,-120 150,-20 C170,60 60,90 0,40 Z" fill="#5EEAD4" opacity=".85"/><ellipse cx="0" cy="20" rx="26" ry="70" fill="#3A2A4E"/><circle cx="0" cy="-50" r="26" fill="#3A2A4E"/><circle cx="-10" cy="-54" r="5" fill="#FFB38A"/><circle cx="10" cy="-54" r="5" fill="#FFB38A"/><path d="M-6,-72 Q-30,-110 -40,-100 M6,-72 Q30,-110 40,-100" fill="none" stroke="#3A2A4E" stroke-width="5" stroke-linecap="round"/><circle cx="-80" cy="-30" r="14" fill="#150F1E" opacity=".5"/><circle cx="80" cy="-30" r="14" fill="#150F1E" opacity=".5"/></g>`},
  {tag:'C · Paper boat',desc:'A small folded boat on dark water. Idea: a stop on someone else’s path; it carries a thought and moves on. Calm, wandering.',svg:`<g transform="translate(200,170)"><path d="M-160,70 Q-80,50 0,70 T160,70" fill="none" stroke="#5EEAD4" stroke-width="5" opacity=".6"/><path d="M-160,110 Q-80,90 0,110 T160,110" fill="none" stroke="#5EEAD4" stroke-width="5" opacity=".35"/><path d="M-130,30 L130,30 L90,80 L-90,80 Z" fill="#F3EFFA"/><path d="M0,-90 L0,30 L-70,30 Z" fill="#FFB38A"/><path d="M0,-90 L0,30 L70,30 Z" fill="#F3EFFA"/><circle cx="-26" cy="52" r="6" fill="#150F1E"/><circle cx="26" cy="52" r="6" fill="#150F1E"/><path d="M-12,64 Q0,72 12,64" fill="none" stroke="#150F1E" stroke-width="4" stroke-linecap="round"/></g>`},
  {tag:'D · Moon sprite',desc:'A crescent-moon creature with closed, listening eyes. Idea: the one who is awake with you. Dreamy, safe-feeling without claiming anything.',svg:`<g transform="translate(200,170)"><circle r="150" fill="#FF8066" opacity=".12"/><path d="M60,-125 A135,135 0 1,0 60,125 A95,95 0 1,1 60,-125 Z" fill="#F3EFFA"/><path d="M-112,-26 Q-97,-38 -82,-26 M-112,24 Q-97,12 -82,24" fill="none" stroke="#150F1E" stroke-width="6" stroke-linecap="round"/><circle cx="-124" cy="0" r="8" fill="#FFB38A" opacity=".8"/><circle cx="-150" cy="-120" r="5" fill="#5EEAD4"/><circle cx="-120" cy="140" r="4" fill="#5EEAD4"/><circle cx="120" cy="-140" r="6" fill="#5EEAD4"/></g>`}]},
 lumi2:{bg:'#06184A',muted:'#9FB0D6',accent:'#F2B454',title:'Lumi — ScoreMyBiz · round two',lede:'Four more. Animals and everyday shop objects, all Indian-shop friendly.',cards:[
  {tag:'E · Owl',desc:'A small owl with round glasses perched on the cash drawer. Idea: sees what others miss. Knowing, kind, never preachy.',svg:`<g transform="translate(200,180)"><ellipse rx="100" ry="120" fill="#7A5433"/><ellipse cx="0" cy="30" rx="70" ry="80" fill="#C9A06C"/><circle cx="-34" cy="-30" r="34" fill="#FBF6E6"/><circle cx="34" cy="-30" r="34" fill="#FBF6E6"/><circle cx="-34" cy="-30" r="40" fill="none" stroke="#22346F" stroke-width="6"/><circle cx="34" cy="-30" r="40" fill="none" stroke="#22346F" stroke-width="6"/><line x1="-6" y1="-30" x2="6" y2="-30" stroke="#22346F" stroke-width="6"/><circle cx="-30" cy="-26" r="10" fill="#06184A"/><circle cx="38" cy="-26" r="10" fill="#06184A"/><path d="M-10,8 L10,8 L0,26 Z" fill="#F2B454"/><path d="M-100,-80 L-70,-120 L-50,-80 M100,-80 L70,-120 L50,-80" fill="#7A5433"/><path d="M-100,20 Q-150,60 -120,100 M100,20 Q150,60 120,100" fill="none" stroke="#7A5433" stroke-width="18" stroke-linecap="round"/></g>`},
  {tag:'F · Elephant',desc:'A young elephant with a ledger under its trunk. Idea: remembers every rupee. Strong, patient, prosperous feel, no religious markings.',svg:`<g transform="translate(200,180)"><ellipse cx="0" cy="20" rx="120" ry="100" fill="#8FA3C7"/><ellipse cx="-120" cy="-10" rx="48" ry="70" fill="#7B90B8"/><ellipse cx="120" cy="-10" rx="48" ry="70" fill="#7B90B8"/><path d="M-20,40 Q-10,120 40,140 Q70,150 70,120" fill="none" stroke="#8FA3C7" stroke-width="34" stroke-linecap="round"/><circle cx="-36" cy="-10" r="10" fill="#06184A"/><circle cx="36" cy="-10" r="10" fill="#06184A"/><path d="M-16,30 Q0,42 16,30" fill="none" stroke="#06184A" stroke-width="6" stroke-linecap="round"/><rect x="60" y="80" width="90" height="70" rx="8" fill="#D9634A" transform="rotate(-12 105 115)"/><rect x="70" y="90" width="70" height="50" rx="5" fill="#FBF6E6" transform="rotate(-12 105 115)"/></g>`},
  {tag:'G · Sparrow',desc:'A cheeky sparrow that hops along the counter and the sign board. Idea: small, everywhere, quick. Light, local, humorous.',svg:`<g transform="translate(200,190)"><ellipse cx="0" cy="20" rx="90" ry="70" fill="#B98A5A"/><circle cx="60" cy="-40" r="52" fill="#C9A06C"/><path d="M100,-40 L140,-30 L100,-20 Z" fill="#F2B454"/><circle cx="72" cy="-52" r="8" fill="#06184A"/><path d="M-80,10 Q-30,-40 20,10" fill="#8A6239"/><path d="M-100,60 L-140,90 M-100,60 L-150,60" stroke="#8A6239" stroke-width="10" stroke-linecap="round"/><path d="M-20,90 L-20,130 M30,90 L30,130" stroke="#F2B454" stroke-width="8" stroke-linecap="round"/><path d="M-30,130 L-10,130 M20,130 L40,130" stroke="#F2B454" stroke-width="8" stroke-linecap="round"/><rect x="-160" y="130" width="320" height="16" rx="6" fill="#7A5433"/></g>`},
  {tag:'H · Chai cup',desc:'A steaming cutting-chai glass with a face. Idea: the companion of every shop morning and every decision. Warm, familiar, very relatable.',svg:`<g transform="translate(200,180)"><path d="M-70,-90 L-55,110 L55,110 L70,-90 Z" fill="#F6E9D2" stroke="#D9C7A8" stroke-width="5"/><path d="M-62,-20 L-56,100 L56,100 L62,-20 Z" fill="#C97A3A"/><path d="M-70,-90 L70,-90" stroke="#D9C7A8" stroke-width="8"/><path d="M-30,-110 Q-20,-150 -30,-180 M0,-110 Q10,-150 0,-190 M30,-110 Q40,-150 30,-180" fill="none" stroke="#C5CFE8" stroke-width="6" stroke-linecap="round" opacity=".8"/><circle cx="-22" cy="20" r="8" fill="#06184A"/><circle cx="22" cy="20" r="8" fill="#06184A"/><path d="M-14,50 Q0,62 14,50" fill="none" stroke="#06184A" stroke-width="6" stroke-linecap="round"/><path d="M-70,20 L-110,50 M70,20 L110,-10" stroke="#F6E9D2" stroke-width="12" stroke-linecap="round"/></g>`}]},
 mira2:{bg:'#150F1E',muted:'#B7AECB',accent:'#FF8066',title:'Mira — Waypoint · round two',lede:'Four more. Night creatures and quiet objects; none with a human face.',cards:[
  {tag:'E · Fox',desc:'A small fox with a soft glow, like the fox avatars already inside the app. Idea: curious, comes close, never stays. Fits the brand you have.',svg:`<g transform="translate(200,180)"><circle r="140" fill="#FF8066" opacity=".12"/><path d="M-90,-20 L-110,-120 L-30,-70 Z M90,-20 L110,-120 L30,-70 Z" fill="#FF8066"/><ellipse rx="100" ry="90" fill="#FF8066"/><path d="M-60,20 Q0,110 60,20 Z" fill="#FFE2D5"/><circle cx="-36" cy="-10" r="10" fill="#150F1E"/><circle cx="36" cy="-10" r="10" fill="#150F1E"/><ellipse cx="0" cy="40" rx="10" ry="7" fill="#150F1E"/><path d="M-14,56 Q0,66 14,56" fill="none" stroke="#150F1E" stroke-width="5" stroke-linecap="round"/></g>`},
  {tag:'F · Window cat',desc:'A cat on a windowsill at night, city lights behind. Idea: keeps you company without asking. Independent, calm.',svg:`<g transform="translate(200,180)"><rect x="-150" y="-150" width="300" height="200" rx="10" fill="#2A1E3D"/><rect x="-140" y="-140" width="280" height="180" fill="#1b1430"/><circle cx="-80" cy="-90" r="4" fill="#FFB38A"/><circle cx="20" cy="-110" r="4" fill="#5EEAD4"/><circle cx="90" cy="-70" r="4" fill="#FFB38A"/><circle cx="-110" cy="-40" r="3" fill="#5EEAD4"/><rect x="-170" y="50" width="340" height="18" rx="6" fill="#3A2A4E"/><ellipse cx="0" cy="20" rx="80" ry="40" fill="#F3EFFA"/><circle cx="40" cy="-20" r="40" fill="#F3EFFA"/><path d="M10,-50 L15,-85 L40,-55 M70,-50 L65,-85 L40,-55" fill="#F3EFFA"/><path d="M-80,30 Q-130,10 -120,-30" fill="none" stroke="#F3EFFA" stroke-width="14" stroke-linecap="round"/><path d="M26,-24 Q34,-30 42,-24 M50,-24 Q58,-30 66,-24" fill="none" stroke="#150F1E" stroke-width="4" stroke-linecap="round"/></g>`},
  {tag:'G · Firefly',desc:'A tiny firefly, mostly a dot of light with a trail. Idea: one small light that proves others are out there too. Minimal, poetic, easy to animate.',svg:`<g transform="translate(200,180)"><path d="M-160,120 C-100,40 -40,140 20,40 C50,-10 70,-20 60,-40" fill="none" stroke="#5EEAD4" stroke-width="4" opacity=".4" stroke-dasharray="4 12"/><circle cx="60" cy="-40" r="60" fill="#5EEAD4" opacity=".15"/><circle cx="60" cy="-40" r="34" fill="#5EEAD4" opacity=".35"/><ellipse cx="60" cy="-40" rx="18" ry="26" fill="#DFFBF5"/><ellipse cx="60" cy="-62" rx="12" ry="12" fill="#3A2A4E"/><path d="M40,-55 Q10,-90 30,-100 M80,-55 Q110,-90 90,-100" fill="none" stroke="#B7AECB" stroke-width="5" opacity=".7"/><circle cx="56" cy="-64" r="2.5" fill="#FFB38A"/><circle cx="64" cy="-64" r="2.5" fill="#FFB38A"/></g>`},
  {tag:'H · Paper plane',desc:'A folded paper plane with a small face, always in flight. Idea: a message sent into the night and answered. Hopeful, light, moves well on screen.',svg:`<g transform="translate(200,180) rotate(-18)"><path d="M-150,20 L130,-60 L-30,90 Z" fill="#F3EFFA"/><path d="M-150,20 L-30,90 L-20,10 Z" fill="#D9D2E6"/><path d="M-150,20 L130,-60 L-20,10 Z" fill="#FFFFFF"/><circle cx="40" cy="-20" r="6" fill="#150F1E"/><circle cx="70" cy="-30" r="6" fill="#150F1E"/><path d="M48,-6 Q58,2 68,-10" fill="none" stroke="#150F1E" stroke-width="4" stroke-linecap="round"/><path d="M-170,60 Q-120,70 -90,110" fill="none" stroke="#5EEAD4" stroke-width="4" opacity=".5" stroke-dasharray="4 10"/></g>`}]}
};
const S=SETS[which]; for(const k of ['bg','muted','accent']) document.body.style.setProperty('--'+k,S[k]);
document.getElementById('app').innerHTML=`<h1>${S.title}</h1><div class="lede">${S.lede}</div><div class="grid">${S.cards.map(c=>`<div class="card"><svg viewBox="0 0 400 340">${c.svg}</svg><div class="tag">${c.tag}</div><div class="desc">${c.desc}</div></div>`).join('')}</div>`;
</script></body></html>
