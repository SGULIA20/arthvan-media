<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(../../engine/fonts/Inter-800.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../engine/fonts/Inter-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box} body{width:1600px;background:var(--bg);font-family:Inter,sans-serif;color:#fff;padding:40px}
h1{font-weight:800;font-size:44px;margin-bottom:6px} .lede{color:var(--muted);font-weight:600;font-size:22px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:rgba(255,255,255,.06);border-radius:28px;padding:22px;text-align:center}
.card svg{width:100%;height:330px} .tag{font-weight:800;font-size:30px;margin-top:8px;color:var(--accent)} .desc{font-weight:600;font-size:19px;color:var(--muted);margin-top:8px;line-height:1.35;min-height:100px}
</style></head><body><div id="app"></div>
<script>
const Q=new URLSearchParams(location.search), which=Q.get('c');
const SETS={
 lumi:{bg:'#06184A',muted:'#9FB0D6',accent:'#F2B454',title:'Lumi — ScoreMyBiz',lede:'Four candidates, same flat style. Each can show calm, worried and bright moods.',cards:[

  {tag:'B · Coin',desc:'A gold rupee coin with a face and a confident stance. Idea: money that talks back. Bolder, more "business", good for stats.',svg:`<g transform="translate(200,170)"><circle r="110" fill="#F2B454" stroke="#C98B2A" stroke-width="10"/><circle r="86" fill="none" stroke="#C98B2A" stroke-width="4" opacity=".6"/><text x="-34" y="-8" font-size="90" font-weight="800" font-family="Inter" fill="#8A5A12">₹</text><circle cx="-26" cy="-40" r="9" fill="#06184A"/><circle cx="26" cy="-40" r="9" fill="#06184A"/><path d="M-22,40 Q0,62 22,40" fill="none" stroke="#06184A" stroke-width="7" stroke-linecap="round"/><path d="M-110,10 L-150,40" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/><path d="M110,10 L150,-30" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/><path d="M-40,110 L-50,160 M40,110 L50,160" stroke="#F2B454" stroke-width="14" stroke-linecap="round"/></g>`},
  {tag:'C · Khata (notebook)',desc:'A shop ledger with glasses and a pencil behind its ear. Idea: the book that finally explains itself. Wise, a little funny, very Indian-shop.',svg:`<g transform="translate(200,170)"><rect x="-100" y="-140" width="200" height="280" rx="16" fill="#D9634A"/><rect x="-82" y="-140" width="14" height="280" fill="#B64A33"/><rect x="-60" y="-110" width="140" height="220" rx="10" fill="#FBF6E6"/><circle cx="-10" cy="-50" r="22" fill="none" stroke="#22346F" stroke-width="6"/><circle cx="46" cy="-50" r="22" fill="none" stroke="#22346F" stroke-width="6"/><line x1="12" y1="-50" x2="24" y2="-50" stroke="#22346F" stroke-width="6"/><circle cx="-10" cy="-50" r="7" fill="#22346F"/><circle cx="46" cy="-50" r="7" fill="#22346F"/><path d="M-6,30 Q18,54 42,30" fill="none" stroke="#22346F" stroke-width="6" stroke-linecap="round"/><rect x="60" y="-150" width="16" height="90" rx="4" fill="#F2B454" transform="rotate(20 68 -105)"/><path d="M-100,0 L-140,30 M100,0 L140,-20" stroke="#D9634A" stroke-width="14" stroke-linecap="round"/></g>`},
  {tag:'D · Little helper (robot)',desc:'A small round assistant with a screen face that shows the score. Idea: the advisor in your pocket. Modern, works for the AI Advisor stories.',svg:`<g transform="translate(200,170)"><rect x="-110" y="-110" width="220" height="200" rx="60" fill="#2951FF"/><rect x="-84" y="-80" width="168" height="110" rx="26" fill="#06184A"/><circle cx="-34" cy="-30" r="12" fill="#5EEAD4"/><circle cx="34" cy="-30" r="12" fill="#5EEAD4"/><path d="M-26,4 Q0,24 26,4" fill="none" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round"/><text x="-26" y="60" font-size="40" font-weight="800" font-family="Inter" fill="#F2B454">66</text><circle cx="0" cy="-130" r="12" fill="#F2B454"/><line x1="0" y1="-118" x2="0" y2="-110" stroke="#F2B454" stroke-width="6"/><path d="M-110,10 L-150,50 M110,10 L150,50" stroke="#2951FF" stroke-width="16" stroke-linecap="round"/><path d="M-50,90 L-50,140 M50,90 L50,140" stroke="#2951FF" stroke-width="16" stroke-linecap="round"/></g>`}]},
 mira:{bg:'#150F1E',muted:'#B7AECB',accent:'#FF8066',title:'Mira — Waypoint',lede:'Four candidates for a character that listens. No human face, so nothing about who you are.',cards:[
  {tag:'A · Lantern',desc:'A soft paper lantern that glows brighter when someone answers. Matches names like MoonlitLantern. Quiet, patient.',svg:`<g transform="translate(200,170)"><circle r="140" fill="#FF8066" opacity=".16"/><line x1="0" y1="-160" x2="0" y2="-120" stroke="#B7AECB" stroke-width="6"/><rect x="-60" y="-120" width="120" height="22" rx="8" fill="#3A2A4E"/><path d="M-80,-100 C-110,-20 -110,40 -80,110 L80,110 C110,40 110,-20 80,-100 Z" fill="#FFB38A" stroke="#FF8066" stroke-width="6"/><path d="M-80,-40 L80,-40 M-92,20 L92,20 M-80,80 L80,80" stroke="#FF8066" stroke-width="4" opacity=".6"/><rect x="-50" y="110" width="100" height="18" rx="6" fill="#3A2A4E"/><circle cx="-22" cy="0" r="7" fill="#150F1E"/><circle cx="22" cy="0" r="7" fill="#150F1E"/><path d="M-12,24 Q0,32 12,24" fill="none" stroke="#150F1E" stroke-width="5" stroke-linecap="round"/></g>`},
  {tag:'B · Moth',desc:'A night moth drawn to small lights. Idea: it finds you when you are up late. Gentle, a little melancholy, very Waypoint.',svg:`<g transform="translate(200,170)"><path d="M0,0 C-40,-120 -170,-120 -150,-20 C-170,60 -60,90 0,40 Z" fill="#5EEAD4" opacity=".85"/><path d="M0,0 C40,-120 170,-120 150,-20 C170,60 60,90 0,40 Z" fill="#5EEAD4" opacity=".85"/><ellipse cx="0" cy="20" rx="26" ry="70" fill="#3A2A4E"/><circle cx="0" cy="-50" r="26" fill="#3A2A4E"/><circle cx="-10" cy="-54" r="5" fill="#FFB38A"/><circle cx="10" cy="-54" r="5" fill="#FFB38A"/><path d="M-6,-72 Q-30,-110 -40,-100 M6,-72 Q30,-110 40,-100" fill="none" stroke="#3A2A4E" stroke-width="5" stroke-linecap="round"/><circle cx="-80" cy="-30" r="14" fill="#150F1E" opacity=".5"/><circle cx="80" cy="-30" r="14" fill="#150F1E" opacity=".5"/></g>`},
  {tag:'C · Paper boat',desc:'A small folded boat on dark water. Idea: a stop on someone else’s path; it carries a thought and moves on. Calm, wandering.',svg:`<g transform="translate(200,170)"><path d="M-160,70 Q-80,50 0,70 T160,70" fill="none" stroke="#5EEAD4" stroke-width="5" opacity=".6"/><path d="M-160,110 Q-80,90 0,110 T160,110" fill="none" stroke="#5EEAD4" stroke-width="5" opacity=".35"/><path d="M-130,30 L130,30 L90,80 L-90,80 Z" fill="#F3EFFA"/><path d="M0,-90 L0,30 L-70,30 Z" fill="#FFB38A"/><path d="M0,-90 L0,30 L70,30 Z" fill="#F3EFFA"/><circle cx="-26" cy="52" r="6" fill="#150F1E"/><circle cx="26" cy="52" r="6" fill="#150F1E"/><path d="M-12,64 Q0,72 12,64" fill="none" stroke="#150F1E" stroke-width="4" stroke-linecap="round"/></g>`},
  {tag:'D · Moon sprite',desc:'A crescent-moon creature with closed, listening eyes. Idea: the one who is awake with you. Dreamy, safe-feeling without claiming anything.',svg:`<g transform="translate(200,170)"><circle r="150" fill="#FF8066" opacity=".12"/><path d="M60,-125 A135,135 0 1,0 60,125 A95,95 0 1,1 60,-125 Z" fill="#F3EFFA"/><path d="M-112,-26 Q-97,-38 -82,-26 M-112,24 Q-97,12 -82,24" fill="none" stroke="#150F1E" stroke-width="6" stroke-linecap="round"/><circle cx="-124" cy="0" r="8" fill="#FFB38A" opacity=".8"/><circle cx="-150" cy="-120" r="5" fill="#5EEAD4"/><circle cx="-120" cy="140" r="4" fill="#5EEAD4"/><circle cx="120" cy="-140" r="6" fill="#5EEAD4"/></g>`}]}
};
const S=SETS[which]; for(const k of ['bg','muted','accent']) document.body.style.setProperty('--'+k,S[k]);
document.getElementById('app').innerHTML=`<h1>${S.title}</h1><div class="lede">${S.lede}</div><div class="grid">${S.cards.map(c=>`<div class="card"><svg viewBox="0 0 400 340">${c.svg}</svg><div class="tag">${c.tag}</div><div class="desc">${c.desc}</div></div>`).join('')}</div>`;
</script></body></html>
